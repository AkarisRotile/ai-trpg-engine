title: 洋馆之夜
system: COC7
era: "1925 年秋 · 美国马萨诸塞州，阿卡姆镇郊外。禁酒令时期，汽车刚普及，乡下地方枪支不算罕见但也没到人人随身带的地步。"
players: "1-4"
summary: >-
  1925 年秋，一场暴雨把几位互不相识的人困在阿卡姆郊外的霍尔本宅。
  这栋房子登记为长期空置，但门是从外面用铁链锁上的——而屋里有灯。
  一夜之内，他们必须弄清楚：是谁锁的门，又是谁还在里面。
premise: >-
  你们各自因为一封信来到霍尔本宅。信上说，屋主埃德蒙·霍尔本留下了一些
  「需要交给明白人」的东西。雨太大，回程的路已经断了。
start_scene: scene_01_门厅
tags: [恐怖, 密室, 短篇, 新手友好]
